<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - GameTech</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">

        <a class="navbar-brand" href="index.html">
          <img src="img/logo.png" alt="Logotipo GameTech">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuLogin">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuLogin">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Promoções</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Console</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Jogos</a>
            </li>
          </ul>

          <a class="btn btn-primary" href="index.html">Voltar à loja</a>
        </div>

      </div>
    </nav>
  </header>

  <main>

    <section id="section-login" class="container">
      <h1>Login</h1>

      <form>
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuário</label>
          <input type="text" class="form-control" name="usuario" id="usuario" placeholder="Digite seu usuário">
        </div>

        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" name="senha" id="senha" placeholder="Digite sua senha">
        </div>

        <input type="button" value="Login" class="btn btn-primary" id="bt-login" onclick="login()" />
      </form>
    </section>

    <section id="section-cadastro" class="container">
      <div id="botao-cadastrar">
        <button type="button" class="btn btn-info">
          Não é cadastrado ainda? Cadastre-se
        </button>
      </div>

      <form id="form-cadastrar">
        <h2>Cadastro</h2>

        <div class="mb-3">
          <label for="nome-cadastro" class="form-label">Nome completo</label>
          <input type="text" class="form-control" id="nome-cadastro" placeholder="Digite seu nome completo">
        </div>

        <div class="mb-3">
          <label for="email-cadastro" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email-cadastro" placeholder="Digite seu e-mail">
        </div>

        <div class="mb-3">
          <label for="usuario-cadastro" class="form-label">Usuário</label>
          <input type="text" class="form-control" id="usuario-cadastro" placeholder="Crie um usuário">
        </div>

        <div class="mb-3">
          <label for="senha-cadastro" class="form-label">Senha</label>
          <input type="password" class="form-control" id="senha-cadastro" placeholder="Crie uma senha">
        </div>

        <input type="button" value="Cadastrar" class="btn btn-primary" id="bt-cadastrar" onclick="cadastro()" />
      </form>
    </section>

  </main>

  <footer>
    <p>© 2026 GameTech - Loja de Eletrônicos Gamer | Brasília - DF</p>
  </footer>

  <button id="voltar-topo" type="button" class="btn btn-outline-primary" onclick="topo()">
    &uarr; Voltar ao topo
  </button>

  <script src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/jquery-script.js"></script>

</body>
</html>
